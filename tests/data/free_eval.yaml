  - {title: "交✌️免费Qoder CN一年", offer: true, tool: Qoder}
  - {title: "【RelayFor】限免100刀DeepSeekv4.1Flash", offer: true, tool: DeepSeek}
  - {title: "智谱登录送积分x10,使用积分100%返还", offer: true, tool: Zhipu}
  - {title: "Kiro白嫖首月额度的银行卡问题", offer: true, tool: Kiro}
