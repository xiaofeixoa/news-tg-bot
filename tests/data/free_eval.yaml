# Ground-truth labels for the /免费 detector.
#
# Chinese cases are verbatim from the live linux.do / Reddit / Hacker News
# corpus (2026-09-25). English positives are synthesised from the phrasings
# vendors actually use, because the corpus held no English promo that day -
# the English negatives below are real, and they are the harder half.
#
# `offer: true` means "somebody can get something for nothing right now, and a
# reader would act on it". Lottery-only posts, questions, and non-AI giveaways
# are false on purpose: the command is about free AI tooling, not 抽奖 in general.
#
# Recall/precision are asserted in tests/test_free_eval.py. Change this file,
# not the test, when the vocabulary evolves.

items:
