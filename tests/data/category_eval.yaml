# 规则模式分类的评测集（design doc §12 的第一层）
#
# 每一条都是 2026-09-26 从线上库里真实抓到的标题（带来源名，因为 source_hint 用它）。
# `expect` 允许列多个可接受答案：分类本来就有合理的多解（一条 SageMaker 部署文
# 既算算力也算应用），只有全都不命中才算错。没有多解的条目就是硬判断。
#
# 这个文件存在的理由：2026-09-26 实测 54 条在线标题里约 20 条被规则分错栏目——
# "U.S. appeals court upholds designation of Anthropic…"进了 AI Applications，
# GitHub Trending 的仓库进了 AI Models/AI Agent，arXiv 论文进了 AI Models。
# 之前只有几条零散断言，没人能量化这件事。

