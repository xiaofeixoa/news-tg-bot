# 规则门（第一层：这条新闻值不值得入库）的评测集
#
# 每一条都是 2026-09-29 从线上库里取的真实标题。`expect: keep` 是"该入库"，
# `expect: drop` 是"该被门槛挡掉"。
#
# 这个文件存在的理由：2026-09-29 数了 7 天的量——183 条没有任何关键词命中而被丢掉，
# 其中 31 条（17%）唯一的 AI 信号就是 "model/models"：Hugging Face 的
# vision-language models、TechCrunch 的 voice models 融资、一整批 Reddit 的模型发布
# 与选型帖。`filters.keywords` 里从来没有 model（也没有 agi），于是这些新闻连入库
# 都不会发生，读者永远看不见。加词之前，没人能量化这件事。

# ---- 该入库：标题里只有 model/models/agi 这一个 AI 信号
