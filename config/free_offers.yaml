  "编程 Agent/IDE": [Qoder, Zcode, opencode, "Claude Code", Codex, "Gemini CLI", Cursor, Windsurf,
                    "GitHub Copilot", Cline, Aider, Continue, Trae, CodeBuddy, Zed, OpenClaw]
