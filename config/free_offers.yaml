# ---------- 有效期线索（只认月份/星期/明确天数，避免 "through Portland" 这种误判）----------
expiry_patterns:
  - '\b(?:until|till|through|by)\s+(?:the\s+)?(?:\d{1,2}\s+)?(?:january|february|march|april|may|june|july|august|september|october|november|december)\b'
  - '\b(?:until|till|through|by)\s+(?:the\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|midnight|eoy|month\s+end)\b'
  - '\bfor\s+(?:a\s+)?(\d+)\s*(?:days?|hours?|weeks?|months?)\b'
  - '(?:截止|截至)\s*(?:到)?\s*(?:\d{1,2}\s*月\s*\d{1,2}\s*日|\d{4}-\d{1,2}-\d{1,2})'
  - '\d{1,2}\s*月\s*\d{1,2}\s*日(?:前|之前|截止)'
  - '(?:限时|活动期间|促销期|优惠期)[^。，,]{0,12}'

# ---------- 展示分组与图标 ----------
kinds:
  "编程 Agent/IDE": "💻"
  "模型": "🤖"
  "API/平台": "☁️"
  "其他": "🎁"

# 主体到 kind 的映射（未列出的走"其他"）
