# ============================================================
# /免费 功能词表：识别"某个 agent / 模型 / API 现在免费"的资讯
# 全部可调，不需要改代码。
# ============================================================

# 命中一条免费资讯至少需要：一个 free 信号 + 一个主体（工具/模型/厂商）
min_signals: 1
require_subject: true
# 正文里只认这些强信号，并且必须与主体相邻（避免 "free software"、硬件帖里的 "no cost" 误报）
body_max_distance: 140
# 注意 "for free" 故意不放进这里：它更多出现在"我自己跑着不要钱"的用法描述里，
# 而不是官方的免费公告里；出现在标题中才算数（signals_en）。
signals_strong:
  - is free
  - now free
  - made free
  - free to use
  - free access
  - free tier
  - free credits
  - free quota
  - free api
  - limited-time free
  - 免费
  - 限免
  - 限时免费
  - 白嫖
  - 免费额度
  - 免费使用
  - 免费开放
  - 开放试用
  - 送额度
  - 送积分

# ---------- 免费信号（英文）----------
signals_en:
  - free
  - for free
  - is free
  - now free
  - made free
  - completely free
  - free to use
  - free access
  - free tier
  - free plan
  - free credits
  - free quota
  - free api
  - no cost
  - no-charge
  - at no charge
  - zero cost
  - $0
  - 0 dollar
  - free trial
  - limited-time free
  - open for free
  - unlocked for free
  - without a subscription
  - no subscription required
  # 英文促销的口头说法，之前完全没覆盖：on us / on the house / complimentary
  - on us
  - on the house
  - complimentary
  - free of charge
  - ad-free
  - price drop
  - now cheaper
  - free week
  - promo
  - promotion
  - giveaway

# ---------- 免费信号（中文）----------
signals_zh:
  - 免费
  - 限时免费
  - 白嫖
  - 白薅
  - 0元
  - 零元
  - 不要钱
  - 免费额度
  - 免费试用
  - 免费开放
  - 开放试用
  - 送额度
  - 送积分
  - 兑换码
  - 注册码
  - 限免
  - 降价
  - 免费使用
  - 无限量
  - 不限量
  - 免费API
  - 随便用

# ---------- 明确不是"免费资讯"的说法（避免 camera-free / encoder-free 误报）----------
false_friends:
  - camera-free
  - encoder-free
  - filter-free
  - sugar-free
  - caffeine-free
  - free-tier abuse
  - freedom
  - free speech
  - free will
  - free radical
  - free market
  - copyright-free
  - royalty-free
  # 许可证措辞不是价格促销：开源模型"可以免费商用"是授权声明，不是限免活动
  - free license
  - free commercial license
  - free for commercial use
  - driver-free
  - error-free
  - bug-free
  - noise-free
  - free software
  - free as in freedom
  - is free from
  - free from the
  - feels free
  - feel free
  - for free of

