# ============================================================
# AI News Radar - main tunables. Secrets live in .env, not here.
# ============================================================

app:
  name: AI News Radar
  # 输出语言：zh = 标题/摘要尽量给中文（见下面 translate 段）；en = 保持原文
  language: zh
  # Days of history kept before articles are archived/trimmed (0 = keep forever)
  retention_days: 120

# ---------------------------------------------------------------------------
# /免费 命令
# ---------------------------------------------------------------------------
free:
  days_default: 30
  limit: 12
  # 检测到免费资讯时，额外提高一点分数，让它更容易进入早报
  score_bonus: 6
  # 实时"哪些模型现在免费"：直接查网关的定价接口，比等新闻靠谱。
  # provider 接口挂了会自动跳过，不影响 /免费 输出采集到的限免资讯。
  models:
    enabled: true
    name: OpenRouter
    url: https://openrouter.ai/api/v1/models
    # 同一个 bot 会话内多久重新拉一次（分钟）
    ttl_minutes: 360
    max_items: 8
    # 只排掉"路由器"这种聚合项。alpha / preview 别排：
    # 它们确实是此刻可用的免费模型，而且新闻标题里点名的往往就是它们。
    exclude:
      - openrouter/free
    state_file: free_models.json
  # 主动推送：发现新的限免/新出现的免费模型时通知一次，不用人来回问。
  # 沿用突发新闻的克制策略：每人每日上限 + 冷却，暂停的用户不发。
  alert:
    enabled: true
    within_days: 7          # 只推送最近入库的
    min_confidence: 0.6     # 低于这个置信度的猜测不打扰人
    max_items: 3            # 一条消息里最多列几条
    cooldown_minutes: 90
    max_per_day: 4
    require_title_subject: true  # 主体只在正文里露过面的，不值得打断你
    new_models: true        # 定价接口里新出现的 0 价模型也一起报
    max_models: 5

# ---------------------------------------------------------------------------
# 中文输出
# 上游几乎全是英文源，所以要么让 LLM 出中文摘要（质量最好），
# 要么走免密钥的机器翻译（MyMemory 免费额度）。
# provider: auto = 有 LLM 用 LLM，没有就用 MyMemory；off 关闭翻译
# ---------------------------------------------------------------------------
translate:
  enabled: true
  provider: auto
  # 免费额度保护：每轮翻多少条、每天最多多少次请求（标题/摘要/要点各算一次；
  # 要点排在标题和摘要之后，剩余额度才轮到它）
  per_run_limit: 60
  # 免费 MT 明确不回话的行，累计到这个次数就停止再问（把原文留下、退出队列）。
  # 线上实测队列里就有翻不动的行：一条西班牙语标题、`Naive-N0.5-Flash - 309B-A15.5B`
  # 这类模型名标题——每 10 分钟一轮全部重发，把额度打进 60 分钟退避，结果连能翻的
  # 行也被拖成英文。额度耗尽/超时（整批无返回）不算拒绝，见 translate_pending。
  give_up_after: 3
  daily_budget: 400
  concurrency: 3
  # 每轮处理结束后连续翻译几批（把积压的英文标题尽快补齐）
  rounds_per_run: 2
  # 要点回补：每轮最多扫这么多行、送翻这么多条要点字符串。排在标题和摘要之后，
  # 剩余额度才轮到它；一行问两次都没翻出来就不再问（2026-09-26 之前这段配置是
  # 空头承诺：后台轮只处理标题/摘要，核心内容只有被点开的那条才会翻）。
  points_scan_rows: 120
  points_per_run: 40
  # 列表/简报里优先显示中文标题；缺失时回落到原文
  prefer_translated_title: true
  # 免费机器会把公司名当成英文单词翻译（实测线上：Gemini→双子座、
  # Hugging Face→拥抱人脸、Claude→克劳德、Anthropic→人类技术）。
  # 这些名字在送翻前换成⑴⑵这类占位符、回来再还原——专名翻错不是"译得软"，
  # 是对一家公司说了假话。
  # 只列**没有公认中文名**的名字。Microsoft/Amazon/NVIDIA/Google/Meta 这类有标准
  # 译名的（微软、亚马逊、英伟达、谷歌）不要放进来：机器译成中文是对的，而占位符
  # 一旦没被原样带回来就会被 `kept_intact` 判为翻译失败、整句退回英文。
  keep_terms:
    - OpenAI
    - Anthropic
    - DeepMind
    - Google DeepMind
    - xAI
    - Mistral
    - Perplexity
    - Hugging Face
    - Together AI
    - ChatGPT
    - Claude
    - Gemini
    - Copilot
    - Llama
    - DeepSeek
    - Qwen
    - Grok
    - GPT
    - GPT-5
    - GPT-6
    - Codex
    - Veo
    - Sora
    - Claude Code
    - Amazon Bedrock
    - Amazon SageMaker
    - AWS Bedrock
    - GitHub Copilot
    - Google Gemini
    - AWS
    - Azure
    - Bedrock
    - SageMaker
    - GitHub
    - Kubernetes
    - PyTorch
    - Triton
    - CUDA
    - vLLM
    - SGLang
  # 度量记号走同一套占位符保护：线上实测 "50t/s" 被译成 "50吨/秒"（吨！）、
  # "0.9 KB/token" 被译成 "0.9 KB/令牌"，两条都进了他能看到的列表/简报。
  # 这里只放**带斜杠或大写的吞吐单位**这种不可能有中文名的记号。
  # 不要放裸词 token/tokens：安全语境的 "approval token" 译成"批准令牌"是对的，
  # 保护它反而会把好句子变成中英夹杂。
  keep_units:
    - t/s
    - tok/s
    - toks/s
    - tokens/s
    - token/s
    - it/s
    - req/s
    - KB/token
    - MB/token
    - GB/s
    - MB/s
    - KB/s
    - TB/s
    - QPS
    - TPS

llm:
  provider: openai-compatible
  # base_url / api_key / models come from .env (LLM_BASE_URL, LLM_API_KEY, ...)
  # Two tiers keep token cost under control (design doc section 23).
  tiers:
    light:
      temperature: 0.1
      max_tokens: 700
    strong:
      temperature: 0.3
      max_tokens: 1600
  # Max characters of article content handed to the model
  max_content_chars: 6000
  # Batch size per pipeline run (caps tokens per run)
  process_batch_size: 40
  # Batches drained per scheduled run: a cold-start backlog must surface today's
  # news within one round, not one batch per interval.
  max_batches_per_run: 6
  # When false the whole AI pipeline is skipped: news still flows to Telegram
  enabled: true

enrich:
  # Fetch the article page when the feed only shipped a stub (design doc 6:
  # BeautifulSoup4 正文提取). Measured reason: Google DeepMind and Hugging Face
  # deliver 36-288 characters, so 100 first-party announcements in seven days
  # produced zero briefing-eligible rows while 3.7 KB Reddit threads cleared it.
  enabled: true
  # Below this many characters the stored text counts as a stub.
  min_chars: 600
  # Fetch attempts per processing round, so a slow host cannot stall the pass.
  max_per_round: 5
  max_chars: 12000
  # Recent stub rows are re-queued for a second look, this many rounds deep;
  # without it the 300+ stubs already stored would age out still under-scored.
  backfill_hours: 36

scoring:
  # Weights are configuration, not code (design doc section 11).
  weights:
    importance: 0.35
    relevance: 0.30
    novelty: 0.15
    source_quality: 0.10
    community_heat: 0.10
  # Personalised boost applied on top of the weights (user_interests)
  interest_bonus_max: 15
  # Community heat (HN points / Reddit upvotes) is squashed into 0..100
  community_heat_max_signal: 500
  # 上面那条 500 是" HN 点数 / Reddit 赞"的量级，不能套到星数上：实测 2026-09-27
  # 共享上限 500 时，1,422 星的仓库就已经顶格 100，76,847 星的那条也是 100 —— 星数
  # 差 54 倍而热度分量相同，档位上限之外又造出一层并列。逐字段给上限，星数按 2 万饱和。
  community_heat_ceilings:
    stars: 20000
    stars_today: 2000
    points: 2000
    upvotes: 2000
    score: 2000
    comments: 2000

filters:
  # Layer 1 of the cost control design: pure rules, no tokens spent.
  # A candidate must hit at least one keyword to reach the LLM.
  min_keyword_hits: 1
  keywords:
    - ai
    - a.i.
    - artificial intelligence
    - llm
    - gpt
    - claude
    - gemini
    - llama
    - deepseek
    - qwen
    - mistral
    - grok
    - transformer
    - diffusion
    - machine learning
    - deep learning
    - neural
    - inference
    - training
    - fine-tun
    - rag
    - mcp
    - agent
    - agentic
    - prompt
    - embedding
    - benchmark
    - gpu
    - cuda
    - nvidia
    - vllm
    - sglang
    - ollama
    - hugging face
    - huggingface
    - copilot
    - cursor
    - chatbot
    - multimodal
    - text-to-image
    - text-to-video
    - reasoning
    - openai
    - anthropic
    - deepmind
    - meta ai
    - mistral ai
    - xai
  # Titles matching these never reach storage.
  title_blocklist:
    - weekly roundup of everything
    - deal of the day
    - newsletter archive
  # Domains never collected (ads / pure marketing).
  url_blocklist:
    - doubleclick.net

dedup:
  # Title similarity threshold, 0..1 (design doc section 10.3).
  # Blends token order, literal order and set coverage; clashing version
  # numbers ("4.5" vs "4.6") halve the score so they never merge.
  title_similarity: 0.79
  # Token-set (Jaccard) threshold, catches reordered titles
  token_similarity: 0.75
  # Only compare inside this time window
  window_hours: 72
  # Ask the LLM only for borderline pairs (between the two bounds)
  ai_review_enabled: false
  ai_review_low_bound: 0.60
  # 灰区（0.60-0.79）里两条标题共享多少个"故事词"就直接判定为同一件事。
  # 这个规则存在的原因：灰区原本只有接了 LLM 才会合并，而本机没有 key——
  # 于是重复新闻从来不会被合掉（2026-09-26 实测：3 天里 9 对灰区、7 对是同一件事，
  # 当晚晚报把"OpenAI 特工入侵 Hugging Face"发了两遍）。设 0 可关掉，退回只靠 AI。
  rule_merge_shared_terms: 3
  # Cap AI dedup review calls per pipeline run
  ai_review_max_per_run: 10

events:
  # Merge same-story articles from different sources into one event (§10.5, §41)
  enabled: true
  # How long an event stays open for new members
  open_hours: 48

digest:
  # Headlines shown under 🔥 今日重点 before the category sections start
  top_count: 3
  # Cap on how many lines one source may take in a single briefing. Without it
  # the feed that polled last owns the whole digest; a thin day backfills past
  # the cap anyway. 0 disables it.
  max_per_source: 3
  # 挑稿前先捞多少条候选。上限是给上一条用的：一个源在分数上打平（2026-09-27
  # 实测 GitHub Trending 有 41 条并列 78.0，全池第二高才 76.0），候选窗口一旦被它
  # 占满，max_per_source 就没有别的源可换，只能靠"薄了就放宽"的兜底把同一源的
  # 溢出项再塞回来——那天的晚报因此 8/8 全是星数行。捞得比洪水宽，上限才有意义。
  candidate_limit: 200
  # Show the one-line AI summary under each headline
  show_summary: true
  # Ask the strong model for a "今日总体判断" paragraph at the top
  use_llm_overview: true
  morning:
    enabled: true
    top_items: 10
    # 45, not 55: at 55 the 2026-09-26 pool lost "Anthropic to pay Akamai
    # $11.6 billion..." (54) and every other press story in the 45-54 band, while
    # Reddit/HN chatter cleared the bar on keyword-hit counts. With a 24h window,
    # a per-source cap and only 8-10 slots, the ranking does the filtering - the
    # floor only has to keep out the 尾部垃圾.
    min_score: 45
    window_hours: 24
    header: "☀️ AI 早报"
  evening:
    enabled: true
    top_items: 8
    min_score: 45
    # 晚报 12 点窗口实测等于只有社区源：08:00-20:00 北京 = 00:00-12:00 UTC，
    # 美国媒体那半天在睡觉。2026-09-26 的晚报 8 条里 6 条来自同一个 subreddit，
    # 而当天 Anthropic/Akamai 116 亿美元、法院裁定这些真实新闻一条没进。
    # 拉到 24 小时后靠 is_sent 去重（早报发过的不再发），而不是靠缩短窗口。
    window_hours: 24
    header: "🌙 AI 晚报"
  # Sections rendered in this order; unknown categories go to "Other"
  section_order:
    - AI Models
    - AI Agent
    - AI Infrastructure
    - Open Source
    - Research
    - Companies
    - AI Applications
  section_emoji:
    "AI Models": "🤖"
    "AI Agent": "🧠"
    "AI Infrastructure": "⚙️"
    "Open Source": "🧑‍💻"
    "Research": "📚"
    "Companies": "🏢"
    "AI Applications": "🎯"
    "Other": "📰"
    "Top": "🔥"
  per_message_limit: 3800
  # Telegram sends an article as its own message beyond this count
  list_page_size: 10

# 规则模式栏目归属的三个先验权重（tests/data/category_eval.yaml 是评测集）
# 关键词命中数本身不够：列表长短会偏袒词多的栏目，标题里的实词要被正文的闲词盖过。
classify:
  # 厂商博客只是"题材倾向"，权重必须低到不盖过标题里的实词
  source_hint_weight: 0.35
  # 场域型来源基本决定栏目：arXiv 每条都是论文，GitHub 榜单/发布页每条都是仓库
  venue_hint_weight: 1.2
  model_size_weight: 0.6       # 标题里出现 27B / 0.8B 这类参数量
  repo_title_weight: 1.0       # 标题就是 owner/name 形态的仓库条目

# 低于这条线就在 /stats 与维护日志里报警：磁盘写满时 SQLite 只会静默报错，
# 表现是"新闻突然不采了"，没有任何别的地方会告诉你原因。
alerts:
  min_free_mb: 1024

# 内部枚举值给人看时的中文说法（/sources、--self-check 都会用到）。
# 键是数据库与配置里的真实取值，不要改键，只改说法。
labels:
  source_types:
    rss: RSS 新闻源
    atom: Atom 新闻源
    hackernews: Hacker News
    github: GitHub
    reddit: Reddit
    arxiv: arXiv 论文
    youtube: YouTube
  # 可信度分级：A 一手官方 / B 主流科技媒体 / C 社区 / D 个人
  quality:
    A: A 级（一手官方）
    B: B 级（主流科技媒体）
    C: C 级（社区）
    D: D 级（个人）

# 检索中英对照表：品牌与术语在译文里按设计保留英文写法（NVIDIA 不会被译成
# 「英伟达」），所以他打中文词时必须有第二条路走过去。2026-09-26 活库实测：
# 「英伟达」0 行 vs NVIDIA 34 行；「芯片」0 行 vs chip 14 行；「涨价」0 行 vs
# 价格 6 行。键随便起，匹配时一组的成员互为同义词（不分大小写），谁出现都算。
search:
  aliases:
    NVIDIA: [英伟达, 老黄, GeForce]
    AMD: [超威]
    chip: [芯片, 晶片]
    semiconductor: [半导体, 芯片]
    GPU: [显卡, 显存]
    price: [涨价, 降价, 价格, pricing]
    funding: [融资, 募资, 筹款, funding, rais]
    open-weight: [开源, 开放权重, 开放源码, open-source, open source]
    agent: [智能体, agent]
    model: [模型, model, 模特]
    inference: [推理, inference]
    robot: [机器人, 具身, humanoid]

breaking:
  enabled: true
  threshold: 90
  max_per_day: 5
  cooldown_minutes: 60
  header: "🚨 AI 突发新闻"
  # 规则模式（没有 LLM key）根本打不出 90 分：实测 7 天 564 篇未过滤文章里最高
  # 只有 78 分，一手博客最高 76.9 分——重要性/相关性来自关键词命中数，上限 85/88。
  # 所以那套阈值下突发功能等于没做（线上 is_breaking 合计为 0）。规则模式改用
  # 三重门槛：标题里有"事件词" + 一手来源 + 时效，而不是单纯把分数线调低。
  rule:
    min_score: 45
    min_source_quality: 80
    # 社区渠道也会带着真正的大事件。实测近 7 天有 4 行：heat 253-645、分数 70-78、
    # 采集时就在 24 小时内、标题里有事件词（"Revealing the details of how OpenAI
    # agents hacked Hugging Face"、"U.S. appeals court upholds designation of
    # Anthropic as supply-chain risk"），只因为来源是 Hacker News（质量 65）被挡在
    # 突发之外。热度是"整个社区都在看这一条"唯一的现成信号：同一周 431 行里 418 行
    # heat=0，只有 13 行 ≥100 —— 250 这条线一周只放进那 4 行，冲不破每天 5 条的上限。
    # 注意：这是对"来源质量/分数"两道门的破例，不破"事件词 + 时效 + exclude_sources"。
    min_community_heat: 250
    max_age_hours: 24
    # 简报里 🔥/⭐/🔹 的分线。2026-09-27 重定标：v1.44 之前这三条线是照着"实测最高 78"
    # 定的，而那个 78 正是档位上限被原始热度灌穿之后的**并列值**（46 条钉在 78.0），
    # 于是 72 这条线的真实含义是"这条是 GitHub 趋势仓库"。修好打分后重算同一批 24 小时
    # 池子（110 行，只读重算、不改库）：
    #   max 78.0 · p90 61.8 · p75 57.6 · p60 54.4 · p50 52.7 · p30 50.8 · p20 47.9 · min 45.9
    #   旧线 72/62/52 → 🔥2% ⭐6% 🔹43% ▫️47%（近一半入选稿子被标成"不重要"）
    #   新线 62/54/49 → 🔥9% ⭐33% 🔹34% ▫️22%（分线取 p90 / p60 / p25）
    hot_score: 62
    star_score: 54
    dot_score: 49
    event_patterns:
      - '\b(announc\w+|unveil\w+|introduc\w+)\b'
      - '\bnow (available|live|generally available)\b'
      - '\b(acquir\w+|merger|raises|raising|funding round|valuation)\b'
      - '\b(lawsuit|\bsue\w+|indicted|antitrust|court|ruling|ruled|verdict|settlement|investigat\w+|banned)\b'
      - '\b(outage|breach|hacked|exploit\w*|vulnerabilit\w+|data\s+leak)\b'
      - '\$\s?\d+(\.\d+)?\s?(b|bn|billion)\b'
    # 命中事件词但不算新闻的标题：版本号刷新的 release、社区自荐、招聘
    exclude_titles:
      - '^v?\d+\.\d+'
      - '^show hn'
      - '^eli5'
      - '^\[p\]'
      - '^hiring'
    # 二手/社区渠道：同样的词在这里是讨论，不是发布
    exclude_sources:
      - 'reddit'
      - 'arxiv'
      - 'hacker news free'
      - 'trending'

bot:
  news_limit: 10
  search_limit: 10
  # Natural-language answers may look back this many days
  chat_lookback_days: 14
  chat_context_size: 12
  deep_analysis_min_content: 200

sources_quality:
  # Credibility tiers, design doc section 40. Feeds source_quality score.
  A: 95
  B: 80
  C: 65
  D: 45
  # Maximum final_score per tier: community chatter (HN/r/repo) can rank high
  # inside its tier but can never out-announce an official source.
  tier_caps:
    A: 100
    B: 100
    C: 78
    D: 68

logging:
  level: INFO
  max_bytes: 5242880
  backup_count: 5
