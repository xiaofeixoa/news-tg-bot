# /etc/systemd/system/ai-news-radar.service.d/no-bot.conf
#
# 场景：还没有 Telegram Bot Token，或者这台机器连不上 api.telegram.org
# （在中国大陆服务器上实测过：采集侧全部正常，Telegram 侧不通）。
# 加上这个覆盖后，服务只做采集 + 去重 + AI 处理，新闻照常入库，
# 等你填好 token 再删掉这个文件恢复完整功能。
#
#   sudo mkdir -p /etc/systemd/system/ai-news-radar.service.d
#   sudo cp deploy/ai-news-override-no-bot.conf \
#        /etc/systemd/system/ai-news-radar.service.d/no-bot.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ai-news-radar
#
# 恢复：删除该文件 + daemon-reload + restart。

[Service]
ExecStart=
ExecStart=/opt/ai-news-radar/.venv/bin/python -m app.main --no-bot
